name: Check the page

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: The generated pages are what build.py makes
        run: |
          python3 build.py
          git diff --exit-code -- . || { echo "Run python3 build.py and commit the pages."; exit 1; }
      - name: The numbers on the page match the programs
        run: python3 check_facts.py
